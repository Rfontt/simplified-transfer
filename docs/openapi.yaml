openapi: 3.0.3
info:
  title: Simplified Transfer API
  version: 0.1.0
  description: |
    Account creation endpoint for the simplified transfer system
    (DDD + CQRS + Event Sourcing study project).
servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: accounts
    description: Account operations
  - name: users
    description: User operations

paths:
  /users:
    post:
      tags:
        - users
      summary: Create a new user
      description: |
        Creates a user with a unique document (CPF or CNPJ) and email.
        The password is stored hashed with bcrypt. Account creation is a
        separate step (POST /accounts).
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            examples:
              common:
                summary: Create a COMMON user
                value:
                  full_name: Rita Fontenele
                  document: 529.982.247-25
                  email: rita@example.com
                  password: secret
                  type: common
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: |
            Invalid request. The body is malformed, a required field is
            missing, the document is not a valid CPF or CNPJ, or the type is
            not common or shopkeeper.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A user with this document or email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /accounts:
    post:
      tags:
        - accounts
      summary: Create a new account
      description: |
        Creates an account for an already-existing user. Each user can own at
        most one account.
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
            examples:
              account:
                summary: Create a BRL account
                value:
                  owner_id: 3b2a1d9c-5f4e-4a7b-9c0d-8e6f5a4b3c2d
                  currency: BRL
                  balance: 0
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: |
            Invalid request. The body is malformed, the owner_id is not a valid
            UUID, the currency is empty, or the balance is negative.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The owner referenced by owner_id does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: An account already exists for this owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    CreateUserRequest:
      type: object
      required:
        - full_name
        - document
        - email
        - password
        - type
      properties:
        full_name:
          type: string
          description: Full name of the user
          example: Rita Fontenele
        document:
          type: string
          description: CPF (11 digits) or CNPJ (14 digits), with or without punctuation
          example: 529.982.247-25
        email:
          type: string
          format: email
          example: rita@example.com
        password:
          type: string
          format: password
          description: Plain password; stored hashed (bcrypt), never returned
          example: secret
        type:
          type: string
          enum:
            - common
            - shopkeeper
          example: common
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        document:
          type: string
        email:
          type: string
          format: email
        type:
          type: string
          enum:
            - common
            - shopkeeper
      required:
        - id
        - full_name
        - document
        - email
        - type
    CreateAccountRequest:
      type: object
      required:
        - owner_id
        - currency
      properties:
        owner_id:
          type: string
          format: uuid
          description: ID of the existing user that owns the account
        currency:
          type: string
          description: Account currency (e.g. BRL, USD)
          example: BRL
        balance:
          type: number
          format: double
          description: Initial balance (>= 0). Defaults to 0.
          default: 0
          example: 0
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        currency:
          type: string
          example: BRL
        balance:
          type: number
          format: double
          example: 0
      required:
        - id
        - owner_id
        - currency
        - balance
    Error:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message
      required:
        - error
